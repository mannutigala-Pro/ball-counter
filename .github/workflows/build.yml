name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup app
        run: |
          mkdir www
          cp counter.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          echo '{"appId":"com.sohel.ballcounter","appName":"Ball Counter","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Set app icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}
            s=${pair##*:}
            convert icon.jpg -resize ${s}x${s} $RES/mipmap-$d/ic_launcher.png
            convert icon.jpg -resize ${s}x${s} $RES/mipmap-$d/ic_launcher_round.png
            convert icon.jpg -resize ${s}x${s} $RES/mipmap-$d/ic_launcher_foreground.png
          done
